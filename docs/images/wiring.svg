<text x="40" y="590" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">The 1 kΩ / 2 kΩ divider brings the 5 V ECHO signal down to about 3.3 V. Never connect ECHO straight to a GPIO pin.</text>
