<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Wiring for the Beyond the Laptop demos</title>
<desc id="desc">An LED with a 330 ohm resistor on GPIO17 (pin 11) and ground (pin 9); a push button on GPIO2 (pin 3) and ground (pin 6); an HC-SR04 sensor with VCC on 5 V (pin 2), TRIG on GPIO23 (pin 16), ECHO through a 1 kilohm resistor to GPIO24 (pin 18) with 2 kilohms from GPIO24 to ground, and GND on pin 20.</desc>
<rect x="0" y="0" width="960" height="700" rx="16" fill="#FFFFFF"/>
<text x="40" y="50" font-size="22" font-weight="700" fill="#1D1D1F" text-anchor="start">Wiring for all four demos</text>
<text x="40" y="74" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Wire with the Pi powered off. “Pin” is the physical pin on the 40-pin header; the code uses the GPIO number.</text>
